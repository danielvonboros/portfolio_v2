name: Deploy to all-inkl

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Trockenlauf — zeigt nur an, was übertragen und gelöscht würde'
        type: boolean
        default: false

# Läuft ein zweiter Push los, während der erste noch deployt, wird der erste
# abgebrochen. Sonst überholen sich zwei rsync-Läufe auf demselben Ziel.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      # Schlägt der Typecheck fehl, wird nichts hochgeladen.
      - name: Build
        run: yarn build

      - name: SSH einrichten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Hostkey vorab hinterlegt statt blind zu vertrauen. Ohne das
          # müsste StrictHostKeyChecking aus — und damit wäre ein
          # Man-in-the-Middle beim Deploy möglich.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload via rsync
        env:
          # Bei workflow_dispatch mit gesetztem Haken: Trockenlauf.
          # Bei einem Push ist der Wert leer.
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          rsync -rltvz --delete $DRY \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET }}"
