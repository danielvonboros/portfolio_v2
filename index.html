<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titel, Beschreibung, Canonical, hreflang, Open Graph und JSON-LD
         setzt scripts/prerender.mjs pro Seite ein, siehe src/seo/head.ts. -->
    <!--app-head-->
    <meta name="theme-color" content="#DCDBD7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/Satoshi-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html.dvb-pending #root {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dvb.mode");
          var dark =
            stored === "dark" ||
            (!stored && matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.mode = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          root.style.backgroundColor = dark ? "#0D0D0D" : "#DCDBD7";
          // Vorgerendert wird immer hell. Im dunklen Modus fliegen die hellen
          // Styles raus und der Inhalt bleibt verdeckt, bis React ihn dunkel
          // neu gezeichnet hat (ColorModeProvider entfernt die Klasse).
          if (dark) {
            root.classList.add("dvb-pending");
            var ssr = document.querySelectorAll("style[data-emotion]");
            for (var i = 0; i < ssr.length; i++) ssr[i].remove();
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
